# Moneta FOSS bundle: Traefik's mpass-auth ForwardAuth asserts the
# signed-in user in X-Auth-Request-Email (every client copy is stripped
# at the edge).  Only this endpoint turns it into REMOTE_USER for
# ZulipRemoteUserBackend; see doc/mpass_sso.md.
location = /accounts/login/sso/ {
    include uwsgi_params;
    uwsgi_param REMOTE_USER $http_x_auth_request_email if_not_empty;
    uwsgi_param MPASS_REMOTE_USER_FROM_EDGE 1;
}
